services:
  - name: driver-shifts-api
    type: web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /openapi.json
    region: frankfurt
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driver-shifts-db
          property: connectionString
      - key: DEMO_DAYS
        value: "14"

databases:
  - name: driver-shifts-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
