[project]
name = "driver-shifts-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
required-version = ">=0.12.23,<0.13"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DTZ", "ASYNC", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
strict = true
addopts = ["-ra"]
testpaths = ["tests"]
filterwarnings = ["error"]
anyio_mode = "auto"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not import frameworks"
type = "forbidden"
source_modules = ["app.trips.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_core",
    "pydantic_settings",
    "psycopg",
    "psycopg_pool",
]
