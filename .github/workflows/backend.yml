name: backend

on:
  pull_request:
    paths:
      - backend/**
      - data/**
      - docker-compose.yml
      - .dockerignore
      - scripts/smoke.sh
      - Makefile
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - data/**
      - docker-compose.yml
      - .dockerignore
      - scripts/smoke.sh
      - Makefile
      - .github/workflows/backend.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
      - run: make gate-backend

  smoke:
    name: docker compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make smoke
