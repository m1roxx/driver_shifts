name: app

on:
  pull_request:
    paths:
      - app/**
      - Makefile
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - app/**
      - Makefile
      - .github/workflows/app.yml

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: generated code, format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Generated code matches the sources
        run: |
          make gen DART=dart
          git add --intent-to-add app
          git diff --exit-code -- app

      - name: Format, analyze, test
        run: make gate-app FLUTTER=flutter DART=dart
