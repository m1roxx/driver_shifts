name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api-base-url: ${{ steps.release-env.outputs.api-base-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release tag is vX.Y.Z
        id: version
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error title=Release tag::Tag \"$GITHUB_REF_NAME\" is not vX.Y.Z, for example v0.1.0: the APK version is taken from it."
            exit 1
          fi
          echo "build-name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Release API address is HTTPS
        id: release-env
        run: |
          scripts/check-release-env.sh
          echo "api-base-url=$(jq --raw-output .API_BASE_URL app/env/prod.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/.fvmrc
          cache: true

      - name: Build APK
        env:
          BUILD_NAME: ${{ steps.version.outputs.build-name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make apk FLUTTER=flutter BUILD_NAME="$BUILD_NAME" BUILD_NUMBER="$BUILD_NUMBER"

      - name: Name the APK after the tag
        run: |
          apk="driver-shifts-${GITHUB_REF_NAME}.apk"
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          cd dist
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish GitHub release
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: dist

      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          API_BASE_URL: ${{ needs.apk.outputs.api-base-url }}
        run: |
          apk="driver-shifts-${GITHUB_REF_NAME}.apk"
          sha256sum --check "$apk.sha256"
          notes=$(cat <<EOF
          APK ходит в API по адресу ${API_BASE_URL} (\`app/env/prod.json\`).

          Подписан отладочным ключом Flutter — для демо, не для магазина. Ключ не постоянный:
          если новая версия не ставится поверх старой, удалите старую.
          Проверить файл: \`sha256sum --check $apk.sha256\`.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "$notes"
